<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos | Trabalho 1</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Cabecalho -->
  <header class="app-header">
    <div class="header-container container">
      <a href="#" class="brand" id="brand-logo">
        <span class="brand-icon">🛍️</span>
        <span class="brand-text">Mega<strong>Shop</strong></span>
      </a>

      <!-- Formulario de busca -->
      <form id="search-form" class="search-form">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="search" 
            id="search-input" 
            name="q" 
            placeholder="Pesquisar produto..." 
            autocomplete="off"
            required
          >
          <button type="button" id="btn-clear-search" class="btn-clear-search" title="Limpar">&times;</button>
        </div>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>

      <div class="header-actions">
        <button type="button" id="btn-open-favorites" class="btn btn-favorites">
          <span class="fav-icon">❤️</span>
          <span class="fav-label">Favoritos</span>
          <span id="fav-counter-badge" class="badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteudo principal -->
  <main class="main-content container">
    
    <section class="toolbar">
      <div class="toolbar-left">
        <h1 id="catalog-title" class="section-title">Todos os Produtos</h1>
        <span id="results-count" class="results-count">Carregando produtos...</span>
      </div>

      <div class="toolbar-right">
        <div class="filter-group">
          <label for="category-select" class="filter-label">Categoria:</label>
          <select id="category-select" class="select-input">
            <option value="">Todas as Categorias</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="sort-select" class="filter-label">Ordenar por:</label>
          <select id="sort-select" class="select-input">
            <option value="default">Padrão</option>
            <option value="price-asc">Menor Preço</option>
            <option value="price-desc">Maior Preço</option>
            <option value="rating-desc">Melhor Avaliação</option>
            <option value="title-asc">Nome (A - Z)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Feedback de carregamento ou erro -->
    <section id="feedback-container" class="feedback-container">
    </section>

    <!-- Grade com os produtos -->
    <section id="catalog-section" class="catalog-section">
      <div id="products-grid" class="products-grid">
      </div>
    </section>

  </main>

  <!-- Modal de detalhes do produto -->
  <div id="product-modal" class="modal-backdrop">
    <div class="modal-card">
      <button type="button" id="modal-close-btn" class="modal-close-btn">&times;</button>
      <div id="modal-content-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Painel lateral de favoritos -->
  <div id="favorites-overlay" class="drawer-overlay"></div>
  <aside id="favorites-drawer" class="favorites-drawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <span class="drawer-icon">❤️</span>
        <h2 id="drawer-title">Meus Favoritos</h2>
        <span id="drawer-fav-count" class="badge">0</span>
      </div>
      <button type="button" id="drawer-close-btn" class="drawer-close-btn">&times;</button>
    </div>

    <div id="favorites-list-container" class="drawer-body"></div>

    <div class="drawer-footer">
      <button type="button" id="btn-clear-all-favs" class="btn btn-outline-danger" disabled>
        Limpar Favoritos
      </button>
    </div>
  </aside>

  <!-- Notificacao toast -->
  <div id="toast" class="toast"></div>

  <!-- Rodape -->
  <footer class="app-footer">
    <div class="container footer-content">
      <div class="footer-info">
        <p><strong>Programação Web</strong> - Trabalho 1: Catálogo de Produtos</p>
        <p>Desenvolvido com HTML, CSS e JavaScript (Consumindo a API DummyJSON).</p>
      </div>
      <div class="footer-links">
        <span>Favoritos salvos no localStorage</span>
      </div>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
